name: DevSecOps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # --------------------------------------------------------------------------
  # Étape 1 - Pipeline de base : installation, lint, tests unitaires
  # --------------------------------------------------------------------------
  build-test:
    name: Build & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Installation des dépendances
        run: pip install -r requirements-dev.txt

      - name: Lint (flake8)
        run: flake8 app tests wsgi.py

      - name: Tests unitaires + couverture
        run: pytest -v --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
