{% extends "base.html" %}
{% block content %}
  <h2>Nouvelle note</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('main.create_note_form') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Titre <input name="title" maxlength="120" required></label>
    <label>Contenu <textarea name="content" maxlength="2000" required></textarea></label>
    <button type="submit">Enregistrer</button>
  </form>
  <h2>Notes</h2>
  <ul>
  {% for note in notes %}
    <li><a href="{{ url_for('main.show_note', note_id=note['id']) }}">{{ note['title'] }}</a></li>
  {% endfor %}
  </ul>
{% endblock %}
